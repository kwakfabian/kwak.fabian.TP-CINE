<section class="section-header">
    <nav class="nav-header">
        <div class="div-header-izquierda">
            <a id="nombre-cine" routerLink="/home" routerLinkActive="active">CineKwak</a>
        </div>
        <div class="div-header-derecha">
            @if (authService.currentUserData()?.rol === 'admin') {
                <a routerLink="/add-pelicula">Agregar Pelicula</a>
                <a routerLink="/add-funcion">Agregar Funcion</a>
                <a routerLink="/add-candy">Agregar Candy</a>
            }
            <a routerLink="/home" routerLinkActive="active">Inicio</a>
            <a routerLink="/candy" routerLinkActive="active">Candy</a> 
            @if (authService.currentUser()) {
                <a routerLink="/favoritos" routerLinkActive="active">Favoritos</a>
                <a href="#" (click)="logout(); $event.preventDefault()">Cerrar sesion</a>
            } @else {
                <a routerLink="/login">Iniciar sesion</a>
            }
        </div>
    </nav>
</section>
