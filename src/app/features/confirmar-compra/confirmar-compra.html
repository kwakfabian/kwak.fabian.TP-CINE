<section class="section-confirmar">

    @if (esAnonimo()) {
        <div class="datos-invitado">
            <h3>Antes de confirmar, completá tus datos</h3>

            <form [formGroup]="datosInvitadoForm">
                <div>
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" formControlName="nombre">
                </div>

                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" formControlName="email">
                </div>

                <div>
                    <label for="fecha_nacimiento">Fecha de nacimiento</label>
                    <input type="date" id="fecha_nacimiento" formControlName="fecha_nacimiento">
                </div>
            </form>
        </div>
    }

    <button [disabled]="!puedeConfirmar()" (click)="confirmarCompra()">
        Confirmar Compra
    </button>

</section>
